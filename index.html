<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YILD</title>
<link rel="canonical" href="https://yild.app/">
<link rel="icon" href="LOGO_YILD_600x600.png">
<meta name="description" content="YILD. Coming soon.">
<style>
:root{ --bg:#f2f2f0; --ink:#111111; --dark:#2D2D2D; }
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }
body{ background:var(--bg); display:flex; align-items:center; justify-content:center; -webkit-font-smoothing:antialiased; }
.wrap{ display:flex; flex-direction:column; align-items:center; gap:64px; padding:40px 24px; }
.wm{ height:44px; width:auto; display:block; }
.ops-steps{ display:flex; align-items:flex-start; justify-content:center; margin-top:0; }
.ops-step{ flex:0 0 auto; width:168px; text-align:center; }
.ops-conn{ flex:0 0 auto; width:96px; height:2px; margin-top:25px;
background-image:repeating-linear-gradient(90deg, rgba(17,17,17,0.55) 0 6px, transparent 6px 12px);
background-size:12px 2px; animation:march .8s linear infinite; }
@keyframes march{ from{ background-position:0 0; } to{ background-position:12px 0; } }
.ops-ic{ height:52px; display:flex; align-items:center; justify-content:center; margin:0 auto; }
.ops-ic svg{ width:50px; height:50px; stroke:var(--ink); stroke-width:1.4; fill:none; overflow:visible; }
.ops-ic svg *{ vector-effect:non-scaling-stroke; }
.ic-morning{ stroke-linecap:round; }
.ic-morning .sun{ transform-box:fill-box; transform-origin:center bottom; animation:rise 5s ease-out infinite; }
@keyframes rise{ 0%{ transform:translateY(4px); opacity:0; } 28%{ transform:translateY(-1.5px); opacity:1; } 100%{ transform:translateY(-1.5px); opacity:1; } }
.ic-morning .rays line{ transform-box:fill-box; transform-origin:center; }
.ic-morning .r4{ animation:rayA 5s ease-out infinite; }
.ic-morning .r2{ animation:rayB 5s ease-out infinite; }
.ic-morning .r1{ animation:rayC 5s ease-out infinite; }
.ic-morning .r3{ animation:rayD 5s ease-out infinite; }
.ic-morning .r5{ animation:rayE 5s ease-out infinite; }
@keyframes rayA{ 0%,28%{ opacity:0; transform:scale(.5); } 29.5%{ opacity:1; transform:scale(1.18); } 32%,100%{ opacity:1; transform:scale(1); } }
@keyframes rayB{ 0%,30.5%{ opacity:0; transform:scale(.5); } 32%{ opacity:1; transform:scale(1.18); } 34.5%,100%{ opacity:1; transform:scale(1); } }
@keyframes rayC{ 0%,33%{ opacity:0; transform:scale(.5); } 34.5%{ opacity:1; transform:scale(1.18); } 37%,100%{ opacity:1; transform:scale(1); } }
@keyframes rayD{ 0%,35.5%{ opacity:0; transform:scale(.5); } 37%{ opacity:1; transform:scale(1.18); } 39.5%,100%{ opacity:1; transform:scale(1); } }
@keyframes rayE{ 0%,38%{ opacity:0; transform:scale(.5); } 39.5%{ opacity:1; transform:scale(1.18); } 42%,100%{ opacity:1; transform:scale(1); } }
.ic-abacus .bead{ transform-box:fill-box; transform-origin:center; }
.ic-abacus .m1{ animation:mv1 5s ease-in-out infinite; }
.ic-abacus .m2{ animation:mv2 5s ease-in-out infinite; }
.ic-abacus .m3{ animation:mv3 5s ease-in-out infinite; }
@keyframes mv1{ 0%{ transform:translateX(0); } 8%{ transform:translateX(4px); } 48%{ transform:translateX(4px); } 56%{ transform:translateX(0); } 100%{ transform:translateX(0); } }
@keyframes mv2{ 0%,8%{ transform:translateX(0); } 16%{ transform:translateX(-4px); } 56%{ transform:translateX(-4px); } 64%{ transform:translateX(0); } 100%{ transform:translateX(0); } }
@keyframes mv3{ 0%,16%{ transform:translateX(0); } 24%{ transform:translateX(4px); } 64%{ transform:translateX(4px); } 72%{ transform:translateX(0); } 100%{ transform:translateX(0); } }
.ic-cards .cd{ transform-box:fill-box; transform-origin:center; animation:deal 8s ease-in-out infinite; }
.ic-cards .cd:nth-child(1){ animation-delay:0s; }
.ic-cards .cd:nth-child(2){ animation-delay:-2s; }
.ic-cards .cd:nth-child(3){ animation-delay:-4s; }
.ic-cards .cd:nth-child(4){ animation-delay:-6s; }
@keyframes deal{
0%{ transform:translate(0,0); opacity:1; }
12%{ transform:translate(var(--sx,15px),0); opacity:0; }
12.5%{ transform:translate(0,15px); opacity:0; }
37.5%{ transform:translate(0,15px); opacity:0; }
50%{ transform:translate(0,10px); opacity:1; }
62.5%{ transform:translate(0,10px); opacity:1; }
75%{ transform:translate(0,5px); opacity:1; }
87.5%{ transform:translate(0,5px); opacity:1; }
100%{ transform:translate(0,0); opacity:1; }
}
.ic-bars rect{ stroke:none; }
@media (max-width:720px){
.ops-steps{ flex-direction:column; align-items:center; }
.ops-step{ width:auto; }
.ops-conn{ width:2px; height:26px; margin:6px 0;
background-image:repeating-linear-gradient(180deg, rgba(17,17,17,0.55) 0 6px, transparent 6px 12px);
background-size:2px 12px; animation:march-v .8s linear infinite; }
@keyframes march-v{ from{ background-position:0 0; } to{ background-position:0 12px; } }
}
</style>
</head>
<body>
<div class="wrap">
<img class="wm" src="YILD-black.png" alt="YILD" height="44">
<div class="ops-steps" id="opsSteps">
<div class="ops-step">
<div class="ops-ic"><svg viewBox="0 0 24 24">
<g class="ic-morning">
<clipPath id="sunClip"><rect x="0" y="0" width="24" height="19.5"/></clipPath>
<g clip-path="url(#sunClip)">
<g class="sun">
<path d="M7 19.5 a5 5 0 0 1 10 0"/>
</g>
</g>
<g class="rays">
<line class="r1" x1="12" y1="5.5" x2="12" y2="8"/>
<line class="r2" x1="4.7" y1="8.2" x2="6.3" y2="9.8"/>
<line class="r3" x1="19.3" y1="8.2" x2="17.7" y2="9.8"/>
<line class="r4" x1="2.5" y1="14.5" x2="4.6" y2="14.5"/>
<line class="r5" x1="21.5" y1="14.5" x2="19.4" y2="14.5"/>
</g>
<line class="horizon" x1="2.5" y1="19.5" x2="21.5" y2="19.5"/>
</g>
</svg></div>
</div>
<div class="ops-conn"></div>
<div class="ops-step">
<div class="ops-ic"><svg viewBox="0 0 24 24">
<g class="ic-abacus">
<rect x="3.5" y="4" width="17" height="16" rx="1.5"/>
<line x1="3.5" y1="8.7" x2="20.5" y2="8.7"/>
<line x1="3.5" y1="12" x2="20.5" y2="12"/>
<line x1="3.5" y1="15.3" x2="20.5" y2="15.3"/>
<circle cx="15" cy="8.7" r="1.6" fill="#f2f2f0"/>
<circle class="bead m1" cx="7" cy="8.7" r="1.6" fill="#111111"/>
<circle class="bead m2" cx="11" cy="12" r="1.6" fill="#f2f2f0"/>
<circle class="bead m2" cx="14.5" cy="12" r="1.6" fill="#111111"/>
<circle cx="18" cy="12" r="1.6" fill="#111111"/>
<circle cx="15" cy="15.3" r="1.6" fill="#f2f2f0"/>
<circle class="bead m3" cx="7" cy="15.3" r="1.6" fill="#111111"/>
</g>
</svg></div>
</div>
<div class="ops-conn"></div>
<div class="ops-step">
<div class="ops-ic"><svg viewBox="0 0 24 24">
<g class="ic-cards">
<rect class="cd" x="5" y="6" width="14" height="3.4" rx="0.8" fill="#111111"/>
<rect class="cd" x="5" y="6" width="14" height="3.4" rx="0.8" fill="#111111"/>
<rect class="cd" x="5" y="6" width="14" height="3.4" rx="0.8" fill="#111111"/>
<rect class="cd" x="5" y="6" width="14" height="3.4" rx="0.8" fill="#111111"/>
</g>
</svg></div>
</div>
<div class="ops-conn"></div>
<div class="ops-step">
<div class="ops-ic"><svg viewBox="0 0 24 24">
<g class="ic-bars">
<clipPath id="barsClip"><rect x="1" y="2" width="22" height="18.5"/></clipPath>
<g clip-path="url(#barsClip)"><g id="barrow"></g></g>
</g>
</svg></div>
</div>
</div>
</div>
<script>
(function(){
var cds = document.querySelectorAll('.ic-cards .cd');
function rnd(){ return (Math.random() < 0.5 ? '-15px' : '15px'); }
cds.forEach(function(c){
c.style.setProperty('--sx', rnd());
c.addEventListener('animationiteration', function(){ c.style.setProperty('--sx', rnd()); });
});
})();
(function(){
var barrow = document.getElementById('barrow');
if (!barrow) return;
var NS = 'http://www.w3.org/2000/svg';
var P = 3.5, W = 2.9, BASE = 20, N = 7, DUR = 1500, GDUR = 301;
var bars = [];
for (var i=0;i<N;i++){
var r = document.createElementNS(NS,'rect');
r.setAttribute('x', (1 + i*P).toFixed(2));
r.setAttribute('width', W);
r.setAttribute('rx', 0.4);
r.setAttribute('fill', '#111111');
r.style.transformBox = 'fill-box';
r.style.transformOrigin = 'center bottom';
barrow.appendChild(r);
bars.push(r);
}
function rndH(){ return 4 + Math.random()*12; }
function setH(r, h){ r.setAttribute('y', (BASE - h).toFixed(2)); r.setAttribute('height', h.toFixed(2)); }
for (var i=0;i<N;i++){ setH(bars[i], rndH()); bars[i].style.transform = 'scaleY(1)'; }
bars[N-1].style.transform = 'scaleY(0)';
function loop(){
barrow.style.transition = 'transform ' + DUR + 'ms linear';
barrow.style.transform = 'translateX(-' + P + 'px)';
setTimeout(function(){
bars[N-1].style.transition = 'transform ' + GDUR + 'ms ease-out';
bars[N-1].style.transform = 'scaleY(1)';
}, Math.round(DUR * 0.55));
setTimeout(function(){
for (var i=0;i<N-1;i++){ setH(bars[i], parseFloat(bars[i+1].getAttribute('height'))); }
setH(bars[N-1], rndH());
for (var i=0;i<N;i++){ bars[i].style.transition = 'none'; bars[i].style.transform = 'scaleY(1)'; }
bars[N-1].style.transform = 'scaleY(0)';
barrow.style.transition = 'none';
barrow.style.transform = 'translateX(0)';
barrow.getBoundingClientRect();
setTimeout(loop, 30);
}, DUR);
}
setTimeout(loop, 400);
})();
</script>
</body>
</html>
